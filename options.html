<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Options</title>
		<script src="js/options.js"></script>
	</head>
	<body>
		<center>
			<h1><img src="img/icon128.png" width="30px" style="margin-right: 10px;"/>RaspberryCast</h1>
			<form name="settings">
				<h2>Options :</h2>
				<p>Ip adress (ex: 192.168.1.10) :</p> <input type="text" id="raspip" placeholder="Enter the IP"/>
				<br>
				<br>
				<p>Right click (context menu) button action:</p>
				<input type="radio" name="cmFunction" id="cmFmusic" value="music-dl">Download music
				<input type="radio" name="cmFunction" id="cmFmusicsearch" value="music-search">Music Search
				<input type="radio" name="cmFunction" id="cmFbookmark" value="bookmark">Bookmark
				<br>
				<br>
				<button type="button" id="saveButton">Save</button>
			</form>
		</center>
	</body>
</html>
